[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retargetlab"
version = "0.1.0rc4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/retargetlab/replay/vendor/LICENSE"]
description = "Traceable end-effector trajectory retargeting primitives"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.8",
]

[project.scripts]
retargetlab = "retargetlab.cli.main:app"

[project.optional-dependencies]
pipeline = [
  "pin==4.1.0", "pin-pink==4.3.0", "qpsolvers[osqp]==4.13.0",
  "scipy>=1.11", "pyarrow>=15", "PyYAML>=6", "xacro==2.1.1",
  "mujoco==3.13.0", "mink==1.3.0", "daqp==0.9.1",
  "trimesh==5.1.0", "pycollada==0.9.3", "Pillow==12.3.0", "av==15.1.0",
]

collision-mesh = [
  "coacd==1.0.14",
]
replay = [
  "Pillow==12.3.0",
]
video = [
  "av==15.1.0",
]
mink = [
  "mujoco==3.13.0",
  "mink==1.3.0",
  "daqp==0.9.1",
  "trimesh==5.1.0",
  "pycollada==0.9.3",
]
solver = [
  "pin>=3.7",
  "pin-pink>=4.3",
  "qpsolvers[osqp]>=4.0",
  "scipy>=1.11",
]
data = [
  "pyarrow>=15",
]
viz = [
  "matplotlib>=3.8",
]
lerobot = [
  "lerobot==0.6.1",
  "datasets>=4.8,<5",
  "pyarrow>=21,<30",
  "pandas>=2,<3",
  "av==15.1.0",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "lerobot: optional LeRobot runtime acceptance checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.setuptools.package-data]
"retargetlab.replay" = ["viewer.html", "*.js", "vendor/*.js", "vendor/LICENSE", "vendor/README.md"]
