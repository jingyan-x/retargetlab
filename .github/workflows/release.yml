name: Release validation

on:
  pull_request:
  push:
    branches: [master, 'codex/v0.1-release']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build wheel and install two isolated environments
        run: |
          python -m pip wheel --no-deps . -w dist
          wheel=$(find "$PWD/dist" -name 'retargetlab-*.whl' -print -quit)
          python -m venv .venv-process
          .venv-process/bin/python -m pip install -c env/v0.1-process-linux-py312.txt "$wheel[pipeline]" pytest
          python -m venv .venv-reader
          .venv-reader/bin/python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          .venv-reader/bin/python -m pip install -c env/v0.1-reader-linux-py312.txt "$wheel[lerobot]"
          .venv-process/bin/python -m pip check
          .venv-reader/bin/python -m pip check
      - name: Fetch pinned public model
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/enactic/openarm_description.git "$RUNNER_TEMP/openarm"
          git -C "$RUNNER_TEMP/openarm" checkout 6148297241fb0402eafe2c6eed455ae4e90d4552
      - name: Test public release and collision boundaries
        env:
          RETARGETLAB_OPENARM_PUBLIC_SOURCE: ${{ runner.temp }}/openarm
        run: |
          .venv-process/bin/python -m pytest -q tests/integration/test_release.py tests/integration/test_saved_q_replay.py tests/integration/test_native_collision.py
          node --experimental-default-type=module tests/browser/test_playback.mjs
      - name: Exercise installed wheels outside the checkout
        run: |
          python scripts/release_smoke.py --process-python .venv-process/bin/python --reader-python .venv-reader/bin/python --openarm-source "$RUNNER_TEMP/openarm" --output "$RUNNER_TEMP/release-smoke"
          python scripts/build_release_kit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-and-kit
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-smoke-logs
          path: |
            ${{ runner.temp }}/release-smoke/*.json
            ${{ runner.temp }}/release-smoke/*.stdout
            ${{ runner.temp }}/release-smoke/*.stderr

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tag and project license
        run: |
          test -s LICENSE
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish the validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name wheel-and-kit --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *rc* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "RetargetLab $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${prerelease[@]}"
